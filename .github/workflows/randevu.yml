name: Otomatik Kütüphane Randevusu

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch: 

jobs:
  randevu-al:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları İndir
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          pip install playwright
          playwright install chromium

      - name: Botu Çalıştır
        run: python kutuphane.py
